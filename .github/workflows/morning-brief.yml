name: Morning Brief

on:
  workflow_dispatch:   # adds a "Run workflow" button for manual tests

permissions:
  contents: write      # lets the job save the prediction scorecard back to the repo

concurrency: morning-brief   # never run two briefs at the same time

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build and send brief
        run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}     # optional: AI summary
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}             # your Gmail address
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}   # Gmail app password
          EMAIL_TO: ${{ secrets.EMAIL_TO }}                       # optional: send to another address
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}           # only if delivery method is telegram
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save the prediction scorecard
        if: always()
        run: |
          if [ -f data/predictions.csv ]; then
            git config user.name "morning-brief-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/predictions.csv
            git diff --cached --quiet || git commit -m "Scorecard update $(date -u +%F)"
            git pull --rebase --autostash || true
            git push || echo "Could not push the scorecard (not fatal)"
          fi

      - name: Keep a copy of the brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: briefs/
          if-no-files-found: ignore
          retention-days: 30
